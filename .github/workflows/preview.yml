name: Deploy preview to GitHub Pages

# Publishes this branch at <pages-url>/preview/ without touching production: a Pages site holds a single
# deployment, so main is rebuilt unchanged at the site root and shipped in the same artifact.
# The next push to main (deploy.yml) publishes production only; re-run this workflow to bring the preview back.

on:
  push:
    branches: ['preview/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out production (main)
        uses: actions/checkout@v7
        with:
          ref: main
          path: production
      - name: Check out preview
        uses: actions/checkout@v7
        with:
          path: preview
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            preview/package-lock.json
      - name: Build production
        working-directory: production
        run: |
          npm ci
          npm run build
      - name: Test and build preview
        working-directory: preview
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site (production at /, preview at /preview/)
        run: |
          mkdir -p site/preview
          cp -r production/dist/. site/
          cp -r preview/dist/. site/preview/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
