<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model Lineup (dev)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #202428; overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace; }
    canvas { display: block; }
    #stats { position: fixed; top: 8px; right: 8px; background: rgba(10, 12, 14, 0.72); color: #dfe6e0; font-size: 11px;
      line-height: 1.35; padding: 8px 10px; border-radius: 4px; pointer-events: none; white-space: pre; max-height: 96vh; overflow: hidden; }
    #stats b { color: #ffd479; }
    #nav { position: fixed; bottom: 8px; left: 8px; right: 8px; font-size: 11px; color: #cfd6d0; }
    #nav a { color: #9fd0ff; margin-right: 8px; text-decoration: none; }
    body.shot #nav, body.shot #stats.hide { display: none; }
  </style>
</head>
<body>
  <div id="stats">loading…</div>
  <div id="nav"></div>
  <script type="module" src="./models.js"></script>
</body>
</html>
